spring.application.name=smartcalculator

# ==========================
# PostgreSQL Configuration
# ==========================
# DB_URL / DB_USERNAME / DB_PASSWORD are read from environment variables.
# Render (or any Postgres host) gives you these three values when you
# create the database - see README for exact steps.
# Example DB_URL format: jdbc:postgresql://<host>:5432/<database>

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# Hibernate
# ==========================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================
# CORS
# ==========================
# Comma-separated list of origins allowed to call this API.
# For deployment, set CORS_ALLOWED_ORIGINS to your deployed frontend URL.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==========================
# Server
# ==========================

server.port=${PORT:8080}